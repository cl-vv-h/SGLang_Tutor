<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">GDN 与 KDA：同样大小的记忆，不同粒度的遗忘</title><desc id="desc">Each key column receives a retention coefficient. Delta correction follows decay.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
<rect width="1400" height="720" fill="#f8fafc"/>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.mono{font-family:Menlo,Consolas,monospace;font-size:20px}.small{font-size:17px;fill:#475569}</style><text x="700" y="48" text-anchor="middle" class="title">GDN 与 KDA：同样大小的记忆，不同粒度的遗忘</text><rect x="35" y="100" width="1330" height="235" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="140" text-anchor="middle" class="head">GDN</text><rect x="220" y="157" width="245" height="125" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><rect x="545" y="157" width="310" height="125" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><rect x="955" y="157" width="340" height="125" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="343" y="185" text-anchor="middle" class="small">旧状态 [Dv,Dk]</text><text x="343" y="222" text-anchor="middle" class="mono">[10   20]</text><text x="343" y="257" text-anchor="middle" class="mono">[30   40]</text><text x="700" y="205" text-anchor="middle" class="mono">alpha = 0.5</text><text x="700" y="249" text-anchor="middle" class="small">每个 head 一个保留率</text><path d="M470 220 L535 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M862 220 L945 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1125" y="185" text-anchor="middle" class="small">遗忘后的状态</text><text x="1125" y="222" text-anchor="middle" class="mono">[ 5   10 ]</text><text x="1125" y="257" text-anchor="middle" class="mono">[15   20 ]</text><rect x="35" y="370" width="1330" height="235" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="410" text-anchor="middle" class="head">KDA</text><rect x="220" y="427" width="245" height="125" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><rect x="545" y="427" width="310" height="125" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><rect x="955" y="427" width="340" height="125" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="343" y="455" text-anchor="middle" class="small">旧状态 [Dv,Dk]</text><text x="343" y="492" text-anchor="middle" class="mono">[10   20]</text><text x="343" y="527" text-anchor="middle" class="mono">[30   40]</text><text x="700" y="475" text-anchor="middle" class="mono">alpha = [0.9, 0.1]</text><text x="700" y="519" text-anchor="middle" class="small">每个 key 通道一个保留率</text><path d="M470 490 L535 490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M862 490 L945 490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1125" y="455" text-anchor="middle" class="small">遗忘后的状态</text><text x="1125" y="492" text-anchor="middle" class="mono">[ 9    2 ]</text><text x="1125" y="527" text-anchor="middle" class="mono">[27    4 ]</text><text x="700" y="658" text-anchor="middle" class="body">这里只展示遗忘：两者随后都执行 预测 → 误差纠正 → query 读取。</text><text x="700" y="693" text-anchor="middle" class="small">KDA 按列广播，不是按历史 token 生成门，也不是每个矩阵元素一个独立门。</text></svg>
