<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">KDA 分块 prefill 与递归 decode</title><desc id="desc">Prefill 携带块边界状态并行处理，decode 把每个 token 路由到对应 request 状态槽位。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#0f172a}.h{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#111827}.s{font:14px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#334155}.b{stroke-width:1.5;rx:10}.ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="690" fill="#f8fafc"/><text x="700" y="40" text-anchor="middle" class="t">KDA 使用分块 Prefill 与融合递归 Decode</text>
  <rect x="35" y="75" width="650" height="560" fill="#e0f2fe" stroke="#0284c7" class="b"/><text x="360" y="112" text-anchor="middle" class="h">Packed prefill / extend</text>
  <rect x="70" y="145" width="250" height="100" fill="#fff" stroke="#0284c7" class="b"/><text x="195" y="178" text-anchor="middle" class="h">投影数据流</text><text x="195" y="205" text-anchor="middle" class="s">q/k/v/a [1,T,H,D]</text><text x="195" y="229" text-anchor="middle" class="s">beta [1,T,H]</text>
  <rect x="405" y="145" width="240" height="100" fill="#fff" stroke="#0284c7" class="b"/><text x="525" y="178" text-anchor="middle" class="h">Packed 边界</text><text x="525" y="205" text-anchor="middle" class="s">query_start_loc [R+1]</text><text x="525" y="229" text-anchor="middle" class="s">initial slots [R]</text>
  <rect x="190" y="300" width="340" height="150" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="360" y="335" text-anchor="middle" class="h">Chunk KDA scan</text><text x="360" y="367" text-anchor="middle" class="s">在 C 个 token 的 chunk 内并行</text><text x="360" y="396" text-anchor="middle" class="s">chunk 之间传递边界状态</text><text x="360" y="425" text-anchor="middle" class="s">输出 [1,T,H,Dv]</text>
  <rect x="190" y="505" width="340" height="82" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="360" y="537" text-anchor="middle" class="h">写回每 request 最终状态</text><text x="360" y="564" text-anchor="middle" class="s">state_pool[slot] [H,Dv,Dk]</text>
  <path d="M195 245 C220 275 280 285 310 300" class="ar"/><path d="M525 245 C500 275 440 285 410 300" class="ar"/><path d="M360 450 V505" class="ar"/>
  <rect x="725" y="75" width="640" height="560" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="1045" y="112" text-anchor="middle" class="h">单 Token 连续批处理 Decode</text>
  <rect x="760" y="145" width="250" height="100" fill="#fff" stroke="#16a34a" class="b"/><text x="885" y="178" text-anchor="middle" class="h">新 batch 行</text><text x="885" y="205" text-anchor="middle" class="s">mixed_qkv [B,3H*D]</text><text x="885" y="229" text-anchor="middle" class="s">raw gates [B,H*D] / [B,H]</text>
  <rect x="1080" y="145" width="250" height="100" fill="#fff" stroke="#16a34a" class="b"/><text x="1205" y="178" text-anchor="middle" class="h">状态路由</text><text x="1205" y="205" text-anchor="middle" class="s">cache_indices [B]</text><text x="1205" y="229" text-anchor="middle" class="s">state_pool [slots,H,Dv,Dk]</text>
  <rect x="875" y="300" width="340" height="150" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1045" y="335" text-anchor="middle" class="h">融合递归 Kernel</text><text x="1045" y="367" text-anchor="middle" class="s">split + norm + gates + decay</text><text x="1045" y="396" text-anchor="middle" class="s">预测 + 残差 + rank-1 更新</text><text x="1045" y="425" text-anchor="middle" class="s">输出 [1,B,H,Dv]</text>
  <rect x="875" y="505" width="340" height="82" fill="#fef9c3" stroke="#a16207" class="b"/><text x="1045" y="537" text-anchor="middle" class="h">原地状态更新</text><text x="1045" y="564" text-anchor="middle" class="s">回滚需要快照或重算</text>
  <path d="M885 245 C910 275 970 285 1000 300" class="ar"/><path d="M1205 245 C1180 275 1120 285 1090 300" class="ar"/><path d="M1045 450 V505" class="ar"/>
</svg>
