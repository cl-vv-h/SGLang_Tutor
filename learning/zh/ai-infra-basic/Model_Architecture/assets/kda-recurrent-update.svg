<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Delta Attention 递归更新</title><desc id="desc">逐 key 通道状态衰减、预测、残差、秩一 delta 写入与 query 读出。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#0f172a}.h{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#111827}.s{font:14px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#334155}.b{stroke-width:1.5;rx:10}.ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="720" fill="#f8fafc"/><text x="700" y="38" text-anchor="middle" class="t">单 Token、单 Head 的 KDA 递归更新</text>
  <rect x="45" y="145" width="220" height="155" fill="#e0f2fe" stroke="#0284c7" class="b"/><text x="155" y="180" text-anchor="middle" class="h">旧状态 M(t-1)</text><text x="155" y="209" text-anchor="middle" class="s">[Dv,Dk]</text><text x="155" y="244" text-anchor="middle" class="s">列对应 key 特征</text><text x="155" y="270" text-anchor="middle" class="s">行对应 value 特征</text>
  <rect x="45" y="385" width="220" height="125" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="155" y="420" text-anchor="middle" class="h">保留率 alpha(t)</text><text x="155" y="449" text-anchor="middle" class="s">[Dk]，每列一个因子</text><text x="155" y="477" text-anchor="middle" class="s">0 &lt; alpha ≤ 1</text>
  <rect x="340" y="205" width="235" height="150" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="458" y="241" text-anchor="middle" class="h">逐列衰减</text><text x="458" y="273" text-anchor="middle" class="s">Mdec = Mprev ⊙ alpha[None,:]</text><text x="458" y="307" text-anchor="middle" class="s">[Dv,Dk] ⊙ [1,Dk]</text><text x="458" y="333" text-anchor="middle" class="s">→ [Dv,Dk]</text>
  <rect x="645" y="95" width="225" height="115" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="758" y="130" text-anchor="middle" class="h">预测 value</text><text x="758" y="159" text-anchor="middle" class="s">vhat = Mdec @ k</text><text x="758" y="185" text-anchor="middle" class="s">[Dv,Dk] @ [Dk] → [Dv]</text>
  <rect x="645" y="270" width="225" height="115" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="758" y="305" text-anchor="middle" class="h">计算残差</text><text x="758" y="334" text-anchor="middle" class="s">r = v - vhat</text><text x="758" y="360" text-anchor="middle" class="s">[Dv] - [Dv] → [Dv]</text>
  <rect x="645" y="445" width="225" height="125" fill="#fef9c3" stroke="#a16207" class="b"/><text x="758" y="480" text-anchor="middle" class="h">Delta 写入</text><text x="758" y="509" text-anchor="middle" class="s">Delta = beta * r outer k</text><text x="758" y="535" text-anchor="middle" class="s">[Dv,1] @ [1,Dk]</text><text x="758" y="558" text-anchor="middle" class="s">→ [Dv,Dk]</text>
  <rect x="955" y="205" width="220" height="150" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1065" y="241" text-anchor="middle" class="h">新状态 M(t)</text><text x="1065" y="273" text-anchor="middle" class="s">M = Mdec + Delta</text><text x="1065" y="307" text-anchor="middle" class="s">持久 [Dv,Dk]</text><text x="1065" y="333" text-anchor="middle" class="s">写回 request slot</text>
  <rect x="955" y="445" width="220" height="125" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="1065" y="480" text-anchor="middle" class="h">Query 读出</text><text x="1065" y="509" text-anchor="middle" class="s">o = M @ (q / sqrt(Dk))</text><text x="1065" y="535" text-anchor="middle" class="s">[Dv,Dk] @ [Dk]</text><text x="1065" y="558" text-anchor="middle" class="s">→ [Dv]</text>
  <path d="M265 220 H340" class="ar"/><path d="M265 445 C300 430 315 345 355 330" class="ar"/><path d="M575 260 C610 235 625 175 645 160" class="ar"/><path d="M758 210 V270" class="ar"/><path d="M758 385 V445" class="ar"/><path d="M870 508 C910 490 915 350 955 325" class="ar"/><path d="M575 335 C590 410 610 410 625 410 H900 C930 410 930 315 955 315" class="ar"/><path d="M1065 355 V445" class="ar"/>
  <text x="1235" y="130" class="h">Token 激活</text><text x="1235" y="166" class="s">k [Dk]</text><text x="1235" y="193" class="s">v [Dv]</text><text x="1235" y="220" class="s">q [Dk]</text><text x="1235" y="247" class="s">beta 标量</text>
  <text x="700" y="650" text-anchor="middle" class="h">GDN 用一个标量衰减整个矩阵；KDA 独立衰减它的 Dk 个列。</text>
</svg>
