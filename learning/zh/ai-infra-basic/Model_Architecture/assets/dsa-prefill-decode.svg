<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="650" viewBox="0 0 1380 650" role="img" aria-labelledby="title desc">
  <title id="title">DSA prefill 与 decode 对比</title><desc id="desc">对比 packed prefill 和单 token decode 的 shape 与操作。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#0f172a}.h{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#111827}.s{font:14px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#334155}.b{stroke-width:1.5;rx:10}.ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1380" height="650" fill="#f8fafc"/><text x="690" y="40" text-anchor="middle" class="t">同一个 DSA 层会变成两套不同的加速器程序</text>
  <rect x="35" y="75" width="635" height="520" fill="#e0f2fe" stroke="#0284c7" class="b"/><text x="352" y="112" text-anchor="middle" class="h">Packed prefill / extend</text>
  <rect x="75" y="145" width="225" height="80" fill="#fff" stroke="#0284c7" class="b"/><text x="188" y="176" text-anchor="middle" class="h">Query</text><text x="188" y="202" text-anchor="middle" class="s">QI [Tq,HI,DI]</text>
  <rect x="390" y="145" width="225" height="80" fill="#fff" stroke="#0284c7" class="b"/><text x="503" y="176" text-anchor="middle" class="h">变长历史</text><text x="503" y="202" text-anchor="middle" class="s">Σ Lr 个 indexer key</text>
  <rect x="205" y="275" width="295" height="110" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="352" y="307" text-anchor="middle" class="h">批量因果 indexer</text><text x="352" y="335" text-anchor="middle" class="s">概念 scores [Tq,Lmax]</text><text x="352" y="360" text-anchor="middle" class="s">cu_seqlens 给出有效边界</text>
  <rect x="205" y="435" width="295" height="105" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="352" y="468" text-anchor="middle" class="h">稀疏主注意力</text><text x="352" y="495" text-anchor="middle" class="s">ids [Tq,k] → output [Tq,H]</text><text x="352" y="519" text-anchor="middle" class="s">多 query 分摊 launch</text>
  <path d="M188 225 C205 250 260 260 300 275" class="ar"/><path d="M503 225 C490 250 440 260 405 275" class="ar"/><path d="M352 385 V435" class="ar"/>
  <rect x="710" y="75" width="635" height="520" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="1027" y="112" text-anchor="middle" class="h">单 token decode</text>
  <rect x="750" y="145" width="225" height="80" fill="#fff" stroke="#16a34a" class="b"/><text x="863" y="176" text-anchor="middle" class="h">当前 batch 行</text><text x="863" y="202" text-anchor="middle" class="s">QI [B,HI,DI]</text>
  <rect x="1065" y="145" width="225" height="80" fill="#fff" stroke="#16a34a" class="b"/><text x="1178" y="176" text-anchor="middle" class="h">分页历史</text><text x="1178" y="202" text-anchor="middle" class="s">lengths [B]，block tables</text>
  <rect x="880" y="275" width="295" height="110" fill="#fef9c3" stroke="#a16207" class="b"/><text x="1027" y="307" text-anchor="middle" class="h">低维扫描</text><text x="1027" y="335" text-anchor="middle" class="s">scores [B,Lmax] 或融合 TopK</text><text x="1027" y="360" text-anchor="middle" class="s">ids [B,k]，用 -1 padding</text>
  <rect x="880" y="435" width="295" height="105" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1027" y="468" text-anchor="middle" class="h">稀疏分页 MLA</text><text x="1027" y="495" text-anchor="middle" class="s">每 request 读取有界的 k 项</text><text x="1027" y="519" text-anchor="middle" class="s">带宽与元数据主导</text>
  <path d="M863 225 C880 250 935 260 975 275" class="ar"/><path d="M1178 225 C1165 250 1115 260 1080 275" class="ar"/><path d="M1027 385 V435" class="ar"/>
</svg>
