<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Sparse Attention 张量数据流</title><desc id="desc">MLA 主路径与轻量 indexer 并行，经 top-k、缓存地址转换进入稀疏注意力。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#0f172a}.h{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#111827}.s{font:14px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#334155}.b{stroke-width:1.5;rx:10}.ar{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" fill="#f8fafc"/><text x="700" y="38" text-anchor="middle" class="t">DSA：用便宜的检索定位，只对 Top-k 做昂贵注意力</text>
  <rect x="45" y="310" width="175" height="82" fill="#e0f2fe" stroke="#0284c7" class="b"/><text x="133" y="342" text-anchor="middle" class="h">hidden states</text><text x="133" y="368" text-anchor="middle" class="s">X [Tq, Hmodel]</text>
  <rect x="275" y="90" width="235" height="105" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="393" y="123" text-anchor="middle" class="h">MLA 投影</text><text x="393" y="150" text-anchor="middle" class="s">Qmain [Tq,Nq,Dm]</text><text x="393" y="174" text-anchor="middle" class="s">Cnew [Tq,Dc+Dr]</text>
  <rect x="275" y="475" width="235" height="125" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="393" y="508" text-anchor="middle" class="h">Lightning Indexer</text><text x="393" y="535" text-anchor="middle" class="s">QI [Tq,HI,DI]</text><text x="393" y="559" text-anchor="middle" class="s">wI [Tq,HI]</text><text x="393" y="583" text-anchor="middle" class="s">KInew [Tq,DI]</text>
  <rect x="570" y="72" width="235" height="105" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="688" y="105" text-anchor="middle" class="h">MLA latent 缓存</text><text x="688" y="132" text-anchor="middle" class="s">Ccache [Lkv,Dc+Dr]</text><text x="688" y="156" text-anchor="middle" class="s">所有 token 仍可寻址</text>
  <rect x="570" y="492" width="235" height="105" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="688" y="525" text-anchor="middle" class="h">Indexer-key 缓存</text><text x="688" y="552" text-anchor="middle" class="s">KIcache [Lkv,DI]</text><text x="688" y="576" text-anchor="middle" class="s">低维扫描</text>
  <rect x="855" y="425" width="235" height="155" fill="#fef9c3" stroke="#a16207" class="b"/><text x="973" y="460" text-anchor="middle" class="h">打分与 TopK</text><text x="973" y="489" text-anchor="middle" class="s">dot [Tq,Lkv,HI]</text><text x="973" y="514" text-anchor="middle" class="s">scores [Tq,Lkv]</text><text x="973" y="539" text-anchor="middle" class="s">logical_ids [Tq,k]</text><text x="973" y="562" text-anchor="middle" class="s">因果 + request mask</text>
  <rect x="855" y="215" width="235" height="120" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="973" y="250" text-anchor="middle" class="h">分页缓存地址转换</text><text x="973" y="279" text-anchor="middle" class="s">logical_ids [Tq,k]</text><text x="973" y="304" text-anchor="middle" class="s">→ physical_ids [Tq,k]</text>
  <rect x="1150" y="175" width="205" height="190" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1253" y="212" text-anchor="middle" class="h">稀疏 MLA 主核</text><text x="1253" y="242" text-anchor="middle" class="s">gather C [Tq,k,Dc+Dr]</text><text x="1253" y="269" text-anchor="middle" class="s">logits [Tq,Nq,k]</text><text x="1253" y="296" text-anchor="middle" class="s">prob [Tq,Nq,k]</text><text x="1253" y="323" text-anchor="middle" class="s">O [Tq,Nq,Dv]</text><text x="1253" y="347" text-anchor="middle" class="s">→ [Tq,Hmodel]</text>
  <path d="M220 337 C245 255 250 150 275 142" class="ar"/><path d="M220 366 C245 440 250 535 275 535" class="ar"/><path d="M510 142 H570" class="ar"/><path d="M510 535 H570" class="ar"/><path d="M805 545 H855" class="ar"/><path d="M510 535 C690 665 800 645 905 580" class="ar"/><path d="M973 425 V335" class="ar"/><path d="M1090 275 H1150" class="ar"/><path d="M805 125 C990 105 1090 145 1165 195" class="ar"/>
  <text x="700" y="704" text-anchor="middle" class="h">两类缓存都随 L 增长；只有 k 个 latent 条目进入高维 softmax 主核。</text>
</svg>
