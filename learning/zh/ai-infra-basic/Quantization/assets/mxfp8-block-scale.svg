<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title desc">
  <title id="title">MXFP8 block scale</title>
  <desc id="desc">展示 MXFP8 中每 32 个连续 FP8 值共享一个 E8M0 scale。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; font-size: 18px; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .blockA { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; }
      .blockB { fill: #ecfccb; stroke: #65a30d; stroke-width: 1.4; }
      .blockC { fill: #fae8ff; stroke: #a21caf; stroke-width: 1.4; }
      .scale { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.3; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="40" y="45" class="text">原始 BF16/FP16 向量沿连续维度切成 32-value blocks</text>
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="320" height="76" class="blockA"/>
    <rect x="370" y="0" width="320" height="76" class="blockB"/>
    <rect x="740" y="0" width="320" height="76" class="blockC"/>
    <text x="160" y="35" text-anchor="middle" class="text">block 0</text>
    <text x="160" y="58" text-anchor="middle" class="small">x0 ... x31</text>
    <text x="530" y="35" text-anchor="middle" class="text">block 1</text>
    <text x="530" y="58" text-anchor="middle" class="small">x32 ... x63</text>
    <text x="900" y="35" text-anchor="middle" class="text">block 2</text>
    <text x="900" y="58" text-anchor="middle" class="small">x64 ... x95</text>
  </g>
  <path d="M200 170 V230" class="arrow"/>
  <path d="M570 170 V230" class="arrow"/>
  <path d="M940 170 V230" class="arrow"/>
  <g transform="translate(70,245)">
    <rect x="0" y="0" width="260" height="86" class="scale"/>
    <text x="130" y="30" text-anchor="middle" class="text">E8M0 scale 0</text>
    <text x="130" y="58" text-anchor="middle" class="small">s0 = power-of-2</text>
    <text x="130" y="78" text-anchor="middle" class="tiny">由 block 0 的 amax 决定</text>
  </g>
  <g transform="translate(440,245)">
    <rect x="0" y="0" width="260" height="86" class="scale"/>
    <text x="130" y="30" text-anchor="middle" class="text">E8M0 scale 1</text>
    <text x="130" y="58" text-anchor="middle" class="small">s1 = power-of-2</text>
    <text x="130" y="78" text-anchor="middle" class="tiny">由 block 1 的 amax 决定</text>
  </g>
  <g transform="translate(810,245)">
    <rect x="0" y="0" width="260" height="86" class="scale"/>
    <text x="130" y="30" text-anchor="middle" class="text">E8M0 scale 2</text>
    <text x="130" y="58" text-anchor="middle" class="small">s2 = power-of-2</text>
    <text x="130" y="78" text-anchor="middle" class="tiny">由 block 2 的 amax 决定</text>
  </g>
  <g transform="translate(290,375)">
    <rect x="0" y="0" width="600" height="52" class="box"/>
    <text x="300" y="32" text-anchor="middle" class="text">MXFP8 值语义: x ≈ x_fp8 * s_block</text>
  </g>
  <path d="M200 331 C260 362 280 375 320 395" class="arrow"/>
  <path d="M570 331 V375" class="arrow"/>
  <path d="M940 331 C900 362 880 375 860 395" class="arrow"/>
</svg>
