<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">CSA overlapping sequence compression</title><desc id="desc">For m equals four, each compressed slot combines the previous and current chunks through two learned content and gate paths.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px Arial;fill:#0f172a}.h{font:700 17px Arial;fill:#111827}.s{font:14px Arial;fill:#334155}.b{stroke-width:1.5;rx:9}.ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="700" fill="#f8fafc"/><text x="700" y="38" text-anchor="middle" class="t">CSA Overlap Compressor, Example m = 4</text>
  <text x="55" y="92" class="h">Source hidden states X [B,S,H]</text>
  <g fill="#e0f2fe" stroke="#0284c7"><rect x="55" y="115" width="82" height="58" class="b"/><rect x="147" y="115" width="82" height="58" class="b"/><rect x="239" y="115" width="82" height="58" class="b"/><rect x="331" y="115" width="82" height="58" class="b"/><rect x="441" y="115" width="82" height="58" class="b"/><rect x="533" y="115" width="82" height="58" class="b"/><rect x="625" y="115" width="82" height="58" class="b"/><rect x="717" y="115" width="82" height="58" class="b"/><rect x="827" y="115" width="82" height="58" class="b"/><rect x="919" y="115" width="82" height="58" class="b"/><rect x="1011" y="115" width="82" height="58" class="b"/><rect x="1103" y="115" width="82" height="58" class="b"/></g>
  <g class="s" text-anchor="middle"><text x="96" y="151">x0</text><text x="188" y="151">x1</text><text x="280" y="151">x2</text><text x="372" y="151">x3</text><text x="482" y="151">x4</text><text x="574" y="151">x5</text><text x="666" y="151">x6</text><text x="758" y="151">x7</text><text x="868" y="151">x8</text><text x="960" y="151">x9</text><text x="1052" y="151">x10</text><text x="1144" y="151">x11</text></g>
  <rect x="80" y="225" width="530" height="95" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="345" y="257" text-anchor="middle" class="h">Two content paths and two gate paths</text><text x="345" y="285" text-anchor="middle" class="s">U = reshape(X Wcontent) [B,Nc,m,2,D]</text><text x="345" y="307" text-anchor="middle" class="s">Z = reshape(X Wgate) [B,Nc,m,2,D]</text>
  <rect x="790" y="225" width="530" height="95" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="1055" y="257" text-anchor="middle" class="h">Overlap transform for slot i</text><text x="1055" y="285" text-anchor="middle" class="s">previous chunk, path a [m,D]</text><text x="1055" y="307" text-anchor="middle" class="s">concat current chunk, path b [m,D] → [2m,D]</text>
  <rect x="165" y="395" width="300" height="135" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="315" y="428" text-anchor="middle" class="h">Compressed slot c1</text><text x="315" y="456" text-anchor="middle" class="s">sources x0…x3 through path a</text><text x="315" y="480" text-anchor="middle" class="s">sources x4…x7 through path b</text><text x="315" y="507" text-anchor="middle" class="s">content/gate [B,8,D]</text>
  <rect x="550" y="395" width="300" height="135" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="700" y="428" text-anchor="middle" class="h">Feature-wise gated pooling</text><text x="700" y="456" text-anchor="middle" class="s">A = softmax(Z + APE, dim=source)</text><text x="700" y="480" text-anchor="middle" class="s">A [B,2m,D]</text><text x="700" y="507" text-anchor="middle" class="s">c1 = Σsource A ⊙ U → [B,D]</text>
  <rect x="935" y="395" width="300" height="135" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1085" y="428" text-anchor="middle" class="h">Finalize cache entry</text><text x="1085" y="456" text-anchor="middle" class="s">RMSNorm + partial RoPE</text><text x="1085" y="480" text-anchor="middle" class="s">optional quantization</text><text x="1085" y="507" text-anchor="middle" class="s">Ccache[:,1,:] [B,D]</text>
  <path d="M413 145 C500 170 300 195 300 225" class="ar"/><path d="M799 145 C880 175 1040 190 1040 225" class="ar"/><path d="M1055 320 C990 355 470 350 400 395" class="ar"/><path d="M465 463 H550" class="ar"/><path d="M850 463 H935" class="ar"/>
  <text x="700" y="598" text-anchor="middle" class="h">Output stride is m: S source tokens become about ceil(S / m) compressed entries.</text><text x="700" y="628" text-anchor="middle" class="s">At decode, incomplete U/Z rows and the previous path-a chunk are part of persistent compressor state.</text>
</svg>
