<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 CSA and HCA layer dataflow</title><desc id="desc">An interleaved layer schedule where every layer has local sliding-window entries and either sparse CSA or dense HCA compressed entries.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 24px Arial;fill:#0f172a}.h{font:700 17px Arial;fill:#111827}.s{font:14px Arial;fill:#334155}.b{stroke-width:1.5;rx:10}.ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="740" fill="#f8fafc"/><text x="700" y="38" text-anchor="middle" class="t">DeepSeek-V4: Local Exact Entries + One Compressed Long-Range Branch per Layer</text>
  <rect x="40" y="285" width="180" height="92" fill="#e0f2fe" stroke="#0284c7" class="b"/><text x="130" y="318" text-anchor="middle" class="h">hidden X</text><text x="130" y="346" text-anchor="middle" class="s">[Tq,Hmodel]</text>
  <rect x="280" y="88" width="245" height="110" fill="#dcfce7" stroke="#16a34a" class="b"/><text x="403" y="121" text-anchor="middle" class="h">Shared SWA branch</text><text x="403" y="149" text-anchor="middle" class="s">raw K=V [T,w,1,D]</text><text x="403" y="174" text-anchor="middle" class="s">exact recent tokens</text>
  <rect x="280" y="265" width="245" height="130" fill="#f3e8ff" stroke="#9333ea" class="b"/><text x="403" y="299" text-anchor="middle" class="h">CSA layer, m=4</text><text x="403" y="328" text-anchor="middle" class="s">compressed cache [L/4,D]</text><text x="403" y="354" text-anchor="middle" class="s">index scores [Tq,L/4]</text><text x="403" y="378" text-anchor="middle" class="s">selected [Tq,k,D]</text>
  <rect x="280" y="465" width="245" height="110" fill="#fff7ed" stroke="#ea580c" class="b"/><text x="403" y="498" text-anchor="middle" class="h">HCA layer, m'=128</text><text x="403" y="526" text-anchor="middle" class="s">compressed cache [L/128,D]</text><text x="403" y="551" text-anchor="middle" class="s">all valid entries are visible</text>
  <rect x="615" y="188" width="270" height="285" fill="#fef9c3" stroke="#a16207" class="b"/><text x="750" y="224" text-anchor="middle" class="h">Attention support for this layer</text><text x="750" y="265" text-anchor="middle" class="s">CSA: local w ∪ selected k</text><text x="750" y="295" text-anchor="middle" class="s">HCA: local w ∪ all L/m'</text><text x="750" y="341" text-anchor="middle" class="s">K=V, one shared KV head</text><text x="750" y="371" text-anchor="middle" class="s">logits [Tq,Nq,Nvisible]</text><text x="750" y="401" text-anchor="middle" class="s">+ per-head sink logit</text><text x="750" y="431" text-anchor="middle" class="s">softmax over combined support</text>
  <rect x="970" y="188" width="375" height="285" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="1158" y="224" text-anchor="middle" class="h">Output path</text><text x="1158" y="266" text-anchor="middle" class="s">Ohead [Tq,Nq,D]</text><text x="1158" y="298" text-anchor="middle" class="s">inverse RoPE on trailing Dr channels</text><text x="1158" y="330" text-anchor="middle" class="s">group heads [Tq,G,(Nq/G)*D]</text><text x="1158" y="362" text-anchor="middle" class="s">grouped low-rank projection</text><text x="1158" y="394" text-anchor="middle" class="s">[Tq,G,Ro] → [Tq,Hmodel]</text><text x="1158" y="430" text-anchor="middle" class="s">residual path continues</text>
  <path d="M220 315 C245 235 250 145 280 143" class="ar"/><path d="M220 331 H280" class="ar"/><path d="M220 350 C245 430 250 520 280 520" class="ar"/><path d="M525 143 C580 150 600 205 635 230" class="ar"/><path d="M525 330 H615" class="ar"/><path d="M525 520 C580 510 600 455 635 430" class="ar"/><path d="M885 331 H970" class="ar"/>
  <text x="700" y="636" text-anchor="middle" class="h">Layer schedule interleaves CSA and HCA; it does not execute both compressed branches in every layer.</text><text x="700" y="668" text-anchor="middle" class="s">The local sliding-window cache is shared in concept, while compressed pools and partial-chunk state follow each layer's type.</text>
</svg>
