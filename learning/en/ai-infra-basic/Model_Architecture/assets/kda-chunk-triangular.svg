<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">KDA Chunk: Causal Dependencies Become a Triangular Solve</title><desc id="desc">Three token write vectors form a lower triangular system. The solved writes give outputs and the boundary state.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
<rect width="1400" height="830" fill="#f8fafc"/>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.mono{font-family:Menlo,Consolas,monospace;font-size:20px}.small{font-size:17px;fill:#475569}</style><text x="700" y="48" text-anchor="middle" class="title">KDA Chunk: Causal Dependencies Become a Triangular Solve</text><rect x="40" y="100" width="420" height="140" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="250" y="145" text-anchor="middle" class="head">Token 1</text><text x="250" y="184" text-anchor="middle" class="mono">u1 = b1</text><text x="250" y="219" text-anchor="middle" class="small">Depends on chunk input state</text><path d="M460 170 L484 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="100" width="420" height="140" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="700" y="145" text-anchor="middle" class="head">Token 2</text><text x="700" y="184" text-anchor="middle" class="mono">u2 + A21 u1 = b2</text><text x="700" y="219" text-anchor="middle" class="small">Includes the effect of token 1</text><path d="M910 170 L934 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="100" width="420" height="140" rx="12" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5"/><text x="1150" y="145" text-anchor="middle" class="head">Token 3</text><text x="1150" y="184" text-anchor="middle" class="mono">u3 + A31 u1 + A32 u2 = b3</text><text x="1150" y="219" text-anchor="middle" class="small">Includes effects of tokens 1 and 2</text><path d="M700 248 L700 295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="305" width="920" height="175" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="700" y="346" text-anchor="middle" class="head">Solve (I + A) U = B</text><text x="700" y="387" text-anchor="middle" class="mono">[  1     0     0 ]    [u1]    [b1]</text><text x="700" y="421" text-anchor="middle" class="mono">[ A21    1     0 ]  × [u2]  = [b2]</text><text x="700" y="455" text-anchor="middle" class="mono">[ A31   A32    1 ]    [u3]    [b3]</text><path d="M500 480 L350 550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 480 L1050 550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="560" width="600" height="145" rx="12" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><rect x="740" y="560" width="600" height="145" rx="12" fill="#f3e8ff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="602" text-anchor="middle" class="head">Every token output</text><text x="360" y="641" text-anchor="middle" class="small">Input-state read + writes up to this token</text><text x="360" y="680" text-anchor="middle" class="mono">o1, o2, o3</text><text x="1040" y="602" text-anchor="middle" class="head">Chunk boundary state</text><text x="1040" y="641" text-anchor="middle" class="small">Decayed input state + all decayed chunk writes</text><text x="1040" y="680" text-anchor="middle" class="mono">M3  →  next chunk</text><text x="700" y="756" text-anchor="middle" class="body">Aij measures how write j affects prediction i after decay; only j &lt; i contributes.</text><text x="700" y="799" text-anchor="middle" class="small">Kernels prepare state-independent terms, then propagate chunk states; causality remains.</text></svg>
