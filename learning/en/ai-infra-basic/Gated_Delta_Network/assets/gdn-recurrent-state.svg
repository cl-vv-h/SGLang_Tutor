<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">GDN recurrent state update</title>
  <desc id="desc">Mathematical flow of GDN recurrent state update with decay, residual write, and query read.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .state { fill: #f3e8ff; stroke: #9333ea; }
      .gate { fill: #fff7ed; stroke: #ea580c; }
      .vec { fill: #e0f2fe; stroke: #0284c7; }
      .write { fill: #dcfce7; stroke: #16a34a; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; font-size: 18px; }
      .small { font-size: 13px; fill: #374151; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="35" y="180" width="150" height="90" class="box state"/>
  <text x="110" y="213" text-anchor="middle" class="text">S_(t-1)</text>
  <text x="110" y="241" text-anchor="middle" class="small">[V, K]</text>

  <rect x="245" y="55" width="190" height="78" class="box gate"/>
  <text x="340" y="86" text-anchor="middle" class="text">g_t</text>
  <text x="340" y="112" text-anchor="middle" class="small">-exp(A_log)*softplus(...)</text>

  <rect x="245" y="185" width="190" height="78" class="box state"/>
  <text x="340" y="216" text-anchor="middle" class="text">S_decay</text>
  <text x="340" y="242" text-anchor="middle" class="small">exp(g_t) * S_(t-1)</text>

  <rect x="500" y="185" width="170" height="78" class="box vec"/>
  <text x="585" y="216" text-anchor="middle" class="text">v_pred</text>
  <text x="585" y="242" text-anchor="middle" class="small">S_decay @ k_t</text>

  <rect x="500" y="55" width="170" height="78" class="box vec"/>
  <text x="585" y="86" text-anchor="middle" class="text">k_t</text>
  <text x="585" y="112" text-anchor="middle" class="small">[K]</text>

  <rect x="735" y="55" width="170" height="78" class="box vec"/>
  <text x="820" y="86" text-anchor="middle" class="text">v_t</text>
  <text x="820" y="112" text-anchor="middle" class="small">[V]</text>

  <rect x="735" y="185" width="170" height="78" class="box write"/>
  <text x="820" y="216" text-anchor="middle" class="text">r_t</text>
  <text x="820" y="242" text-anchor="middle" class="small">v_t - v_pred</text>

  <rect x="735" y="330" width="170" height="78" class="box gate"/>
  <text x="820" y="361" text-anchor="middle" class="text">beta_t</text>
  <text x="820" y="387" text-anchor="middle" class="small">sigmoid(b_t)</text>

  <rect x="965" y="185" width="190" height="78" class="box write"/>
  <text x="1060" y="216" text-anchor="middle" class="text">write</text>
  <text x="1060" y="242" text-anchor="middle" class="small">beta_t*r_t outer k_t</text>

  <rect x="965" y="330" width="190" height="78" class="box state"/>
  <text x="1060" y="361" text-anchor="middle" class="text">S_t</text>
  <text x="1060" y="387" text-anchor="middle" class="small">S_decay + write</text>

  <rect x="500" y="330" width="170" height="78" class="box vec"/>
  <text x="585" y="361" text-anchor="middle" class="text">o_t</text>
  <text x="585" y="387" text-anchor="middle" class="small">S_t @ q_t</text>

  <path d="M185 225 H245" class="arrow"/>
  <path d="M340 133 V185" class="arrow"/>
  <path d="M435 225 H500" class="arrow"/>
  <path d="M585 133 V185" class="arrow"/>
  <path d="M670 224 H735" class="arrow"/>
  <path d="M820 133 V185" class="arrow"/>
  <path d="M820 263 V330" class="arrow"/>
  <path d="M905 224 H965" class="arrow"/>
  <path d="M585 133 C700 145 890 160 990 190" class="arrow"/>
  <path d="M1060 263 V330" class="arrow"/>
  <path d="M965 370 H670" class="arrow"/>
</svg>
