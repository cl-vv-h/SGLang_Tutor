<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="440" viewBox="0 0 1220 440" role="img" aria-labelledby="title desc">
  <title id="title">GDN chunk prefill</title>
  <desc id="desc">Chunked prefill stages for gated delta rule: chunking, KKT, triangular solve, write vectors, chunk state merge, outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0284c7; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .purple { fill: #f3e8ff; stroke: #9333ea; }
      .yellow { fill: #fef9c3; stroke: #a16207; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; font-size: 17px; }
      .small { font-size: 13px; fill: #374151; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="40" y="170" width="160" height="90" class="box blue"/>
  <text x="120" y="202" text-anchor="middle" class="text">q/k/v/g/beta</text>
  <text x="120" y="230" text-anchor="middle" class="small">[1,T,...]</text>

  <rect x="250" y="170" width="160" height="90" class="box green"/>
  <text x="330" y="202" text-anchor="middle" class="text">chunk split</text>
  <text x="330" y="230" text-anchor="middle" class="small">BT tokens per chunk</text>

  <rect x="460" y="80" width="190" height="90" class="box orange"/>
  <text x="555" y="112" text-anchor="middle" class="text">K @ K^T</text>
  <text x="555" y="140" text-anchor="middle" class="small">lower triangular A</text>

  <rect x="460" y="250" width="190" height="90" class="box orange"/>
  <text x="555" y="282" text-anchor="middle" class="text">gate scaling</text>
  <text x="555" y="310" text-anchor="middle" class="small">exp(g_i - g_j), beta</text>

  <rect x="705" y="170" width="190" height="90" class="box purple"/>
  <text x="800" y="202" text-anchor="middle" class="text">solve tril</text>
  <text x="800" y="230" text-anchor="middle" class="small">(I + A)^-1</text>

  <rect x="945" y="80" width="210" height="90" class="box yellow"/>
  <text x="1050" y="112" text-anchor="middle" class="text">recompute w/u</text>
  <text x="1050" y="140" text-anchor="middle" class="small">corrected writes</text>

  <rect x="945" y="250" width="210" height="90" class="box green"/>
  <text x="1050" y="282" text-anchor="middle" class="text">merge &amp; output</text>
  <text x="1050" y="310" text-anchor="middle" class="small">final state + o</text>

  <path d="M200 215 H250" class="arrow"/>
  <path d="M410 205 C440 165 440 125 460 125" class="arrow"/>
  <path d="M410 225 C440 255 440 295 460 295" class="arrow"/>
  <path d="M650 125 C700 140 725 165 750 170" class="arrow"/>
  <path d="M650 295 C700 275 725 245 750 240" class="arrow"/>
  <path d="M895 198 C920 165 925 130 945 125" class="arrow"/>
  <path d="M895 232 C920 255 925 290 945 295" class="arrow"/>
</svg>
