<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560" role="img" aria-labelledby="title desc">
  <title id="title">GDN layer dataflow</title>
  <desc id="desc">GDN layer from hidden states through projections, convolution, gated delta rule state, gated norm, and output projection.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0284c7; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .purple { fill: #f3e8ff; stroke: #9333ea; }
      .yellow { fill: #fef9c3; stroke: #a16207; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; font-size: 17px; }
      .small { font-size: 13px; fill: #374151; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="40" y="220" width="170" height="88" class="box blue"/>
  <text x="125" y="252" text-anchor="middle" class="text">hidden_states</text>
  <text x="125" y="280" text-anchor="middle" class="small">[T, H_model]</text>

  <rect x="270" y="110" width="210" height="90" class="box green"/>
  <text x="375" y="142" text-anchor="middle" class="text">in_proj_qkvz</text>
  <text x="375" y="170" text-anchor="middle" class="small">[T, 2HK + 2HVV]</text>

  <rect x="270" y="330" width="210" height="90" class="box green"/>
  <text x="375" y="362" text-anchor="middle" class="text">in_proj_ba</text>
  <text x="375" y="390" text-anchor="middle" class="small">[T, 2HV]</text>

  <rect x="535" y="80" width="170" height="82" class="box orange"/>
  <text x="620" y="112" text-anchor="middle" class="text">split q/k/v/z</text>
  <text x="620" y="138" text-anchor="middle" class="small">mixed_qkv, z</text>

  <rect x="535" y="210" width="170" height="82" class="box orange"/>
  <text x="620" y="242" text-anchor="middle" class="text">causal conv1d</text>
  <text x="620" y="268" text-anchor="middle" class="small">q/k/v path</text>

  <rect x="535" y="360" width="170" height="82" class="box orange"/>
  <text x="620" y="392" text-anchor="middle" class="text">gating</text>
  <text x="620" y="418" text-anchor="middle" class="small">g, beta from a/b</text>

  <rect x="780" y="210" width="210" height="100" class="box purple"/>
  <text x="885" y="245" text-anchor="middle" class="text">Gated Delta Rule</text>
  <text x="885" y="272" text-anchor="middle" class="small">state [slots, HV, V, K]</text>
  <text x="885" y="294" text-anchor="middle" class="small">core_out [1,T,HV,V]</text>

  <rect x="780" y="60" width="210" height="82" class="box yellow"/>
  <text x="885" y="92" text-anchor="middle" class="text">z gate</text>
  <text x="885" y="118" text-anchor="middle" class="small">[T, HV, V]</text>

  <rect x="1040" y="160" width="150" height="86" class="box blue"/>
  <text x="1115" y="193" text-anchor="middle" class="text">RMSNormGated</text>
  <text x="1115" y="220" text-anchor="middle" class="small">core_out + z</text>

  <rect x="1040" y="320" width="150" height="86" class="box green"/>
  <text x="1115" y="353" text-anchor="middle" class="text">out_proj</text>
  <text x="1115" y="380" text-anchor="middle" class="small">[T,H_model]</text>

  <path d="M210 245 C240 200 240 155 270 155" class="arrow"/>
  <path d="M210 282 C240 330 240 375 270 375" class="arrow"/>
  <path d="M480 155 H535" class="arrow"/>
  <path d="M620 162 V210" class="arrow"/>
  <path d="M705 251 H780" class="arrow"/>
  <path d="M480 375 H535" class="arrow"/>
  <path d="M705 401 C745 380 765 320 800 300" class="arrow"/>
  <path d="M705 121 H780" class="arrow"/>
  <path d="M990 250 H1040" class="arrow"/>
  <path d="M885 142 C930 145 1000 165 1040 190" class="arrow"/>
  <path d="M1115 246 V320" class="arrow"/>
</svg>
